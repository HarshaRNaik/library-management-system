---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Node.js and npm
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present

- name: Create application group
  ansible.builtin.group:
    name: "{{ app_group }}"
    system: true
    state: present

- name: Create application service user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_directory }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: Copy package.json
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../package.json"
    dest: "{{ app_directory }}/package.json"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
  notify: Restart library application

- name: Copy package-lock.json
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../package-lock.json"
    dest: "{{ app_directory }}/package-lock.json"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
  notify: Restart library application

- name: Copy application source code
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../src/"
    dest: "{{ app_directory }}/src/"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
    directory_mode: '0755'
  notify: Restart library application

- name: Install production dependencies
  ansible.builtin.command:
    cmd: npm ci --omit=dev
    chdir: "{{ app_directory }}"
  environment:
    HOME: /root
  register: npm_install
  changed_when: "'added' in npm_install.stdout or 'removed' in npm_install.stdout"

- name: Install systemd service configuration
  ansible.builtin.template:
    src: library-management.service.j2
    dest: "/etc/systemd/system/{{ app_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify: Restart library application

- name: Enable and start library application
  ansible.builtin.systemd_service:
    name: "{{ app_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
